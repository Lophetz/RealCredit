<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealCredit - 个人记账</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <h2>RealCredit</h2>
            </div>
            <nav>
                <ul>
                    <li class="active" onclick="showSection('dashboard')">仪表盘</li>
                    <li onclick="showSection('transactions')">交易明细</li>
                    <li onclick="showSection('assets')">固定资产 & 折旧</li>
                    <li onclick="showSection('accounts')">会计科目</li>
                </ul>
            </nav>
        </aside>

        <main class="content">
            <header>
                <h1 id="page-title">仪表盘</h1>
                <div class="header-actions">
                    <button class="btn-primary" onclick="openModal('transaction-modal')">+ 新建交易</button>
                    <button class="btn-secondary" onclick="alert('CSV 导入功能即将上线!')">导入 CSV</button>
                </div>
            </header>

            <!-- Dashboard Section -->
            <section id="dashboard" class="view-section active">
                <div class="cards-grid">
                    <div class="card">
                        <h3>总资产</h3>
                        <p class="amount" id="total-assets">¥0.00</p>
                    </div>
                    <div class="card">
                        <h3>总负债</h3>
                        <p class="amount" id="total-liabilities">¥0.00</p>
                    </div>
                    <div class="card">
                        <h3>净资产</h3>
                        <p class="amount highlight" id="net-worth">¥0.00</p>
                    </div>
                </div>

                <div class="recent-activity">
                    <h3>最近交易</h3>
                    <div id="recent-transactions-list" class="list-group">
                        <!-- Loaded via JS -->
                    </div>
                </div>
            </section>

            <!-- Transactions Section -->
            <section id="transactions" class="view-section">
                <h3>所有交易</h3>
                <div id="all-transactions-list" class="list-group"></div>
            </section>

            <!-- Assets Section -->
            <section id="assets" class="view-section">
                <div class="section-header">
                    <h3>固定资产列表</h3>
                    <button class="btn-primary" onclick="openModal('asset-modal')">+ 登记资产</button>
                </div>
                <div id="assets-list" class="grid-list">
                    <!-- Loaded via JS -->
                </div>
            </section>

            <!-- Accounts Section -->
            <section id="accounts" class="view-section">
                <div class="section-header">
                    <h3>科目表</h3>
                    <button class="btn-primary" onclick="openModal('account-modal')">+ 新增科目</button>
                </div>
                <div id="accounts-list" class="list-group"></div>
            </section>
        </main>
    </div>

    <!-- Modals -->
    <div id="transaction-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('transaction-modal')">&times;</span>
            <h2>新建交易</h2>
            <form id="transaction-form">
                <div class="form-group">
                    <label>描述</label>
                    <input type="text" id="t-desc" required>
                </div>
                <div class="form-group">
                    <label>日期</label>
                    <input type="date" id="t-date" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>借方科目 (Debit)</label>
                        <select id="t-debit-acc" required></select>
                    </div>
                    <div class="form-group">
                        <label>贷方科目 (Credit)</label>
                        <select id="t-credit-acc" required></select>
                    </div>
                </div>
                <div class="form-group">
                    <label>金额</label>
                    <input type="number" id="t-amount" step="0.01" required>
                </div>
                <button type="submit" class="btn-primary">记录交易</button>
            </form>
        </div>
    </div>

    <div id="account-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('account-modal')">&times;</span>
            <h2>新增科目</h2>
            <form id="account-form">
                <div class="form-group">
                    <label>名称</label>
                    <input type="text" id="a-name" required>
                </div>
                <div class="form-group">
                    <label>类型</label>
                    <select id="a-type" required>
                        <option value="Asset">资产 (Asset)</option>
                        <option value="Liability">负债 (Liability)</option>
                        <option value="Equity">权益 (Equity)</option>
                        <option value="Income">收入 (Income)</option>
                        <option value="Expense">支出 (Expense)</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">创建</button>
            </form>
        </div>
    </div>

    <div id="asset-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('asset-modal')">&times;</span>
            <h2>登记固定资产</h2>
            <form id="asset-form">
                <div class="form-group">
                    <label>资产名称</label>
                    <input type="text" id="fa-name" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>原值 (Cost)</label>
                        <input type="number" id="fa-cost" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>残值 (Salvage)</label>
                        <input type="number" id="fa-salvage" step="0.01" value="0">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>使用年限 (年)</label>
                        <input type="number" id="fa-life" required>
                    </div>
                    <div class="form-group">
                        <label>购买日期</label>
                        <input type="date" id="fa-date" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>资产科目 (借方)</label>
                    <select id="fa-asset-acc" required></select>
                </div>
                <div class="form-group">
                    <label>折旧费用科目 (折旧时借方)</label>
                    <select id="fa-expense-acc" required></select>
                </div>
                <button type="submit" class="btn-primary">登记资产</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
